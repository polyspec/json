# The folder layout of ordered-json (S5, S7, S9), checked by make layout-check: the common rules of config/layout.kit.yml,
# taken from @polyspec/kit, and the map of this repository. A rule named here replaces the field of the common rule, so a
# list repeats the common entries and adds the entries of this repository, each with its reason right above it.
version: 1
extends:
  - layout.kit.yml

rules:
  - extends_template: no-repository-prefix
    id: layout-no-repository-prefix
    vars: { repo: ordered-json }

  - extends_template: go-module-path
    id: layout-go-module-path
    vars: { repo: ordered-json }

  - id: layout-root-tests
    paths:
      - "tests/*"
      # The node:test tests of the tools of scripts/ and benchmarks/run.mts (make ordered-json-test-scripts).
      - "!tests/scripts"

  # S5: the root files of ordered-json beyond the list of kit (K145).
  # external-inputs.json: the facts of the archive of the supplementary suite, which mise.toml declares.
  # .npmrc: the allow-remote of npm for the URL of the kit release that package.json names.
  - id: layout-root-files
    vars: { root_files: "{external-inputs.json,.npmrc}" }

  - id: layout-infrastructure-typescript
    paths:
      - "scripts/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      - "tests/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      - "!tests/kit/fixture/**"


  # S6 exception of the transition (docs/spec/json-contract.md#transition): legacy/ holds the language packages that the
  # generated bindings replace, under their former paths, until each is removed by a change of its own (plan V-6 (5)).
  - id: layout-root-folders
    paths: ["*", "!packages", "!contracts", "!docs", "!scripts", "!tests", "!examples", "!benchmarks", "!config", "!.github", "!.githooks", "!.kit", "!.mise", "!.claude", "!legacy"]

  # The stub of the legacy PHP extension stays beside its C sources until the package is removed (plan V-6 (5)).
  - id: php-ext-stub-place
    paths: ["**/*.stub.php", "!packages/php-ext/src/*.stub.php", "!legacy/packages/php-ext/src/*.stub.php"]
