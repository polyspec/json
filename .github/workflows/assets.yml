# The assets of each platform of the bindings (binding GN-19a, GN-19i). The workflow ci calls it for the commit of its run, and
# the workflow release calls it for the tree of the tag that it releases, with release true, which runs the release check of
# binding before a job builds (make release-binding-check, GN-19g). Every recipe that builds an asset is in packages/release.mk,
# which binding release-recipes writes and Git ignores, so the recipe of each job first runs make release-recipes.
#
# The job assets-platform runs on the runner of its platform, ubuntu-26.04, ubuntu-26.04-arm or macos-15, because no tool of
# the release compiles for another platform. Each of its jobs builds the static library of the Go module (with the musl
# library of its arch on Linux), the abi3 wheel and the npm platform package once. The independent job assets-php selects and
# builds one PHP minor per platform/minor result; the job assets-npm builds the npm package itself with the wasm-bindgen of
# mise.toml. Each uploads var/release/assets as an artifact, which the workflow release downloads. Each job has one run step,
# make ci-<job> with make variables as its only arguments, RELEASE passing the input release; its recipe in the Makefile
# installs first and then runs every build through ci-targets, each to its end, so one run names every asset that does not
# build.
name: assets

on:
  workflow_call:
    inputs:
      ref:
        description: The tag whose tree the jobs build; empty builds the commit of the calling run
        required: false
        type: string
        default: ''
      release:
        description: Whether each job runs the release check of binding before it builds
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# rustup installs no toolchain on the first cargo; make json-install-rust-packages installs the toolchain of rust-toolchain.toml,
# with its components llvm-tools and clippy and its targets, and fetches the crates of Cargo.lock, which binding reads offline.
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  assets-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v7.0.1: the commit alone, whose time release-wheel reads to date the files of the wheel.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/kit-bootstrap
      # Rust and its crates, the uv and the Python of mise.toml, with which uv builds the wheel, then the static library of the Go
      # module, the wheel and the npm platform package.
      - run: make ci-assets-platform RELEASE=${{ inputs.release }}
      # actions/upload-artifact v7.0.1.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: assets-${{ matrix.platform }}
          path: var/release/assets/
          if-no-files-found: error

  assets-php:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.4'
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.5'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.4'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.5'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.4'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.5'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      # Select one native runtime and its php-config for this platform/minor job.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '${{ matrix.php }}'
          tools: none
          coverage: none
      - uses: ./.github/actions/kit-bootstrap
      # KyleMayes/install-llvm-action v2.0.9: the LLVM of config/toolchain.json (llvm.version), whose libclang and clang the
      # bindgen of ext-php-rs reads (binding GN-19i). The ubuntu-26.04 images hold LLVM 20, 21 and 22 at /usr/lib/llvm-<major>
      # (runner-images Ubuntu2604-Readme.md); the macos-15 image holds only LLVM 17 and Homebrew llvm@18, so the step installs it
      # there and sets LLVM_PATH, which make ci-assets-php passes as LLVM_ROOT.
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        if: runner.os == 'macOS'
        with:
          version: '21.1.8'
          directory: ${{ runner.temp }}/llvm
      # Rust and its crates, then the build of the PHP extension for PHP_MINOR.
      - run: make ci-assets-php PHP_MINOR=${{ matrix.php }} RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: assets-php-${{ matrix.platform }}-${{ matrix.php }}
          path: var/release/assets/
          if-no-files-found: error

  assets-npm:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/kit-bootstrap
      # Rust and its crates and the wasm-bindgen of mise.toml, then the npm package.
      - run: make ci-assets-npm RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: assets-npm
          path: var/release/assets/
          if-no-files-found: error
