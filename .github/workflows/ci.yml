# CI: one pipeline (PRINCIPLES S12). The job kit calls ci-pipeline.yml of this repository, which runs, in each of its jobs, the
# setup targets that config/ci.json declares for that job and then the target of the job in the Makefile: kit-gates-static,
# kit-gates-verify and kit-gates-runtime-<runtime>. The release workflow releases the commit whose run of this
# workflow is green.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Runs on the same pull request are superseded: a new push to a pull request cancels the run of its previous push. A push to main has a ref of its
# own, and its run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  kit:
    uses: ./.github/workflows/ci-pipeline.yml
