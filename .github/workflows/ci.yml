# CI: one pipeline (PRINCIPLES S12). The job kit calls ci-pipeline.yml of this repository, whose job <job> runs make ci-<job>:
# the recipe installs the setup targets that config/ci.json declares for that job and then runs the target of the job in the
# Makefile, kit-gates-static, kit-gates-verify, kit-gates-bindings or kit-gates-runtime-<runtime>. The job assets calls
# assets.yml, which builds the assets of each platform of the bindings on the runner of that platform. The release workflow releases the commit whose run of this workflow is green.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Runs on the same pull request are superseded: a new push to a pull request cancels the run of its previous push. A push to main has a ref of its
# own, and its run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  kit:
    uses: ./.github/workflows/ci-pipeline.yml
  # The assets of each platform of the commit, built as a release builds them (assets.yml, binding GN-19i), without the release
  # check of binding, so a commit whose assets do not build fails its run and no release tags it.
  assets:
    uses: ./.github/workflows/assets.yml
  # The release rehearsal (T3.70): the steps of ci-release before its tag, with no push, rehearse-go-module among them.
  release-rehearsal:
    needs: [assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ hashFiles('.php-version') != '' }}
        with:
          php-version-file: .php-version
          coverage: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: assets-*
          path: var/release/platform-assets
          merge-multiple: true
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-release-rehearsal
