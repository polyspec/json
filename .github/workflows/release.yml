# The release workflow of json, a file of this repository taken from the release workflow of kit (kit writes no copy,
# kit docs/spec/utilities-and-recipes.md).
#
# The workflow starts by itself when a push run of the CI workflow ci succeeds on main (K987): it checks out the head_sha of that
# run, and release-tag with AUTO releases it only when it is the version commit of the top ## X.Y.Z of its change log, which is
# the tip of its push; a commit whose top version is tagged elsewhere ends green with nothing to release, and a top version that
# no run released fails and names its version commit. A concurrency group of the job runs one release of the repository at a time.
# A dispatch of the workflow with the id of a successful CI run releases the commit of that run (K911): it tags the commit with
# the version of the newest section ## X.Y.Z of its change log (K924) and creates the GitHub Release of the tag as a draft with
# its archives, and makes it public. The run is the evidence; the release runs no test again. Each job has one run step,
# make ci-tag or make ci-release, whose recipe runs these targets in order and stops at the first failure, with TAG, vX.Y.Z,
# from the environment, which release-tag writes:
#   bootstrap package installs the locked kit with the npm that devEngines.packageManager names for consumers, without scripts
#   install-tools TOOLS=npm installs the mise, the node and the npm of mise.toml with the bootstrap installer of kit
#   install-packages installs package-lock.json with that npm, @polyspec/kit included, whose utilities the targets below run
#   release-tag      with the kit of main: requires a completed successful push or dispatch run RUN of ci.yml on main whose
#                    commit is on origin/main, reads X.Y.Z from the change log of that commit, creates and pushes the annotated
#                    tag vX.Y.Z and the tag of every Go module at that commit, or passes for a tag there already (K269), and
#                    appends TAG and VERSION to GITHUB_ENV; a tag pushed with the token of the run starts no run
#   checkout of the tag, then the bootstrap, npm and the packages of the tagged commit again
#   release-prepare  the preparation that the release of the repository needs (none for json)
#   release-tools    installs the tools that config/release.json needs for the packages of this repository
#   release-assets  builds the archive of every package of config/release.json into var/release/assets: the zip of the PHP
#                    extension of packages/php-ext, polyspec-json-php-ext-X.Y.Z.zip, and packages.json, the Composer repository
#                    of the release from which PIE installs polyspec/json
#   release-recipes  writes packages/release.mk, the release recipes of the bindings (binding GN-19h)
#   release-go-module carries the Go module of the tag with the static libraries of the platforms (GN-19f) and pushes its tag
#   release-publish creates the GitHub Release of the tag as a draft, with its notes and those files
#   release-platform-assets uploads the assets of each platform to the draft under their labels (GN-19g)
#   release-undraft makes the release public
# The job tag runs the steps up to release-tag and gives TAG and VERSION to the later jobs through its outputs. The job assets
# calls assets.yml with the tag (binding GN-19i): it builds the assets of each platform on the runner of that platform, after the
# release check of binding (make release-binding-check), which fails while a dependency line of polyspec-binding-core names a
# branch or a commit (CK-70). The job release runs the other steps on the tree of the tag, with the assets of the job assets, which
# it merges into var/release/assets after release-assets.
# A failed step leaves the release a draft and fails the run.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful CI run of main whose commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  tag:
    # A workflow_run starts the release for a successful push or dispatch run of CI alone (K987). The concurrency group is the job's,
    # so a run whose job is skipped never replaces the pending release of a version commit.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    env:
      RUN: ${{ inputs.run || github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v7.0.1: with the whole history and every branch, so origin/main is there for the ancestry check; a
      # workflow_run checks out the head_sha of its CI run, never a later main (K987), and a dispatch checks out main, whose kit
      # runs release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      # Tags the commit of the CI run and gives the tag and the version to the later jobs.
      - id: tag
        run: make ci-tag

  assets:
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    uses: ./.github/workflows/assets.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      release: true

  release:
    needs: [tag, assets]
    if: ${{ needs.tag.outputs.tag != '' }}
    concurrency:
      group: release-${{ github.repository }}-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      VERSION: ${{ needs.tag.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      RUSTUP_AUTO_INSTALL: '0'
    steps:
      # The release builds the tree of the tag with its own kit and packages, with the whole history for the Go module.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      # shivammathur/setup-php 2.40.0: the PHP of .php-version. The release runs no check of its own: release-tag refuses a commit
      # whose CI run did not pass (K755).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ hashFiles('.php-version') != '' }}
        with:
          php-version-file: .php-version
          # The proof runs with no debugger or coverage driver, as the checks do.
          coverage: none
      # actions/download-artifact v8.0.2: the assets of each platform that the job assets built, merged into
      # var/release/platform-assets, which make ci-release merges into var/release/assets after it built the archives of the tag.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: assets-*
          path: var/release/platform-assets
          merge-multiple: true
      # The bootstrap of kit for the tagged commit, with its own kit and packages (K992).
      - uses: ./.github/actions/kit-bootstrap
      # The release steps of config/release.json in their order: the tools, the archives of the tag, the Go module, the draft,
      # the assets of each platform and the public release.
      - run: make ci-release
