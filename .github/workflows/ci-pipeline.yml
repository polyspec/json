# The CI pipeline of json, a file of this repository taken from the pipeline of kit (kit writes no copy, kit
# docs/spec/utilities-and-recipes.md). .github/workflows/ci.yml holds the triggers and the concurrency and calls it as its job
# kit, so one push runs one workflow: plan first, then the shared, verify, runtime and bindings jobs in parallel, then required.
# A job holds no content of its own: its one run step is make ci-<job> with make variables as its only arguments, the call
# that a local run of the job makes (make ci-runtime RUNTIME=php), and the recipe of the Makefile holds the order and the
# conditions of the job (tests/scripts/workflow-rules.test.mts). The other steps provision the runner or upload the report.
# The runtime matrix lists the runtimes of config/ci.json, so rules-check reaches the targets of each (kit K1057).
name: ci-pipeline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The plan of config/ci.json names the runner of the other jobs and whether the shared job needs PHP, so it runs on the
  # default runner.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.plan.outputs.runner }}
      has_runtimes: ${{ steps.plan.outputs.has_runtimes }}
      common_tools: ${{ steps.plan.outputs.common_tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - id: plan
        run: make ci-plan

  shared:
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ contains(needs.plan.outputs.common_tools, 'php') }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-shared
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-shared
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The shared verifier of this repository (scripts/verify.mts): it builds every implementation and compares their replies on
  # the shared cases, so it installs the toolchains of every language.
  verify:
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-verify
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-verify
          path: var/report/ci-targets/
          if-no-files-found: ignore

  runtime:
    needs: plan
    if: ${{ needs.plan.outputs.has_runtimes == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [go, php, php-ext, python, rust, ts]
    runs-on: ${{ needs.plan.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ matrix.runtime == 'php' || matrix.runtime == 'php-ext' }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-runtime RUNTIME=${{ matrix.runtime }}
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-runtime-${{ matrix.runtime }}
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The generated bindings of the five targets of the contract, which a release publishes (docs/spec/json-contract.md#transition):
  # the lint of the binding crates, the declarations of the Node binding and the generated tests of each target, which hold the
  # cases of contracts/core.json, on the standard runner of its language (kit-gates-bindings). It runs on ubuntu-26.04-arm,
  # whose image holds the LLVM of config/toolchain.json at /usr/lib/llvm-<major>, the LLVM_ROOT of packages/release.mk that the
  # build of the PHP extension reads.
  bindings:
    needs: plan
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-bindings
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-bindings
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The judgement of the pipeline, which exists only in CI: make ci-required reads the results of every other job from the JSON
  # of needs and fails when one of them did not succeed. The plan selects every job, so a skipped job fails it too. It runs on
  # the default runner, since the runner output of plan is empty when plan fails.
  required:
    if: ${{ always() }}
    needs: [plan, shared, verify, runtime, bindings]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-required RESULTS='${{ toJSON(needs) }}'
