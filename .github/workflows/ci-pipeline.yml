# The CI pipeline of json, a file of this repository taken from the pipeline of kit (kit writes no copy, kit
# docs/spec/utilities-and-recipes.md). .github/workflows/ci.yml holds the triggers and the concurrency and calls it as its job
# kit, so one push runs one workflow: shared first, then the verify and runtime jobs in parallel, then required. Each job runs
# only make targets of the Makefile of this repository: it installs its own locked prerequisites, declared in config/ci.json
# or the deps-<runtime> targets, and runs the target of its job, kit-gates-static, kit-gates-verify or
# kit-gates-runtime-<runtime>, through make ci-targets. The steps name these targets, so rules-check reaches their
# prerequisites (kit K1057); the runtime matrix lists the runtimes of the repository, and the plan adds the tools of each.
name: ci-pipeline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The shared job writes the plan that names the runner of the other jobs (config/ci.json runner), so it runs on the default runner.
  shared:
    runs-on: ubuntu-24.04
    outputs:
      runtimes: ${{ steps.plan.outputs.runtimes }}
      runner: ${{ steps.plan.outputs.runner }}
      has_runtimes: ${{ steps.plan.outputs.has_runtimes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - id: plan
        run: make kit-ci-plan
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ contains(steps.plan.outputs.common_tools, 'php') }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - name: install common gate tools
        if: ${{ steps.plan.outputs.common_tools != '[]' }}
        run: make install-tools TOOLS="${{ join(fromJSON(steps.plan.outputs.common_tools), ' ') }}"
      - name: install shared prerequisites
        run: make kit-ci-setup GROUP=shared
      - id: context_prepare
        name: prepare shared CI context
        run: make kit-ci-context-prepare GROUP=shared
      - name: shared gates
        run: make ci-targets TARGETS=kit-gates-static
      - name: cleanup shared CI context
        if: ${{ always() && steps.context_prepare.outcome != 'skipped' }}
        run: make kit-ci-context-cleanup GROUP=shared
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-shared
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The shared verifier of this repository (scripts/verify.mts): it builds every implementation and compares their replies on
  # the shared cases, so it installs the toolchains of every language.
  verify:
    needs: shared
    runs-on: ${{ needs.shared.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - name: install verify toolchains
        run: make install-tools TOOLS="go rust php composer python uv"
      - name: install verify prerequisites
        run: make json-install-verify
      - name: verify gate
        run: make ci-targets TARGETS=kit-gates-verify
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-verify
          path: var/report/ci-targets/
          if-no-files-found: ignore

  runtime:
    needs: shared
    if: ${{ needs.shared.outputs.has_runtimes == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [go, php, php-ext, python, rust, ts]
        include: ${{ fromJSON(needs.shared.outputs.runtimes) }}
    runs-on: ${{ needs.shared.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ matrix.runtime == 'php' || matrix.runtime == 'php-ext' }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - name: install runtime tools
        if: ${{ join(matrix.installTools, ' ') != '' }}
        run: make install-tools TOOLS="${{ join(matrix.installTools, ' ') }}"
      - name: install runtime prerequisites
        run: make kit-ci-setup GROUP=runtime RUNTIME=${{ matrix.runtime }}
      - id: context_prepare
        name: prepare runtime CI context
        run: make kit-ci-context-prepare GROUP=runtime RUNTIME=${{ matrix.runtime }}
      - name: runtime gate
        run: make ci-targets TARGETS=kit-gates-runtime-${{ matrix.runtime }}
      - name: cleanup runtime CI context
        if: ${{ always() && steps.context_prepare.outcome != 'skipped' }}
        run: make kit-ci-context-cleanup GROUP=runtime RUNTIME=${{ matrix.runtime }}
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-runtime-${{ matrix.runtime }}
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The closing common part: it fails when a job that the plan selected does not succeed. The plan selects shared and verify,
  # and runtime when the repository has one (K950). A job
  # the plan did not select is skipped and is not a result; a selected job that is skipped fails the pipeline. It runs on the
  # default runner, since the runner output of shared is empty when shared fails before the plan.
  required:
    if: ${{ always() }}
    needs: [shared, verify, runtime]
    runs-on: ubuntu-24.04
    env:
      SHARED_RESULT: ${{ needs.shared.result }}
      VERIFY_RESULT: ${{ needs.verify.result }}
      RUNTIME_RESULT: ${{ needs.runtime.result }}
      SHARED_SELECTED: 'true'
      VERIFY_SELECTED: 'true'
      RUNTIME_SELECTED: ${{ needs.shared.outputs.has_runtimes == 'true' }}
    steps:
      - name: require every job that the plan selected
        run: |
          failed=0
          judge() {
            if [ "$3" != true ]; then
              echo "$1: not selected by the plan, not judged"
              return 0
            fi
            echo "$1: $2"
            if [ "$2" != success ]; then
              echo "$1 ended with $2, and the plan selected it; expected success" >&2
              failed=1
            fi
          }
          judge shared "$SHARED_RESULT" "$SHARED_SELECTED"
          judge verify "$VERIFY_RESULT" "$VERIFY_SELECTED"
          judge runtime "$RUNTIME_RESULT" "$RUNTIME_SELECTED"
          exit "$failed"
