[package]
name = "polyspec-ordered-json"
version = "0.0.22"
edition = "2021"
rust-version = "1.99.0"
description = "Strict JSON with insertion-ordered associative objects and exact number literals"
readme = "README.md"
repository = "https://github.com/polyspec/ordered-json.git"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "unbounded_depth"] }

[lib]
name = "polyspec_ordered_json"
path = "src/lib.rs"

[dev-dependencies]
libtest-mimic = "=0.8.2"
sha2 = "0.10"
serde_json = "1"

# The official examples run as the trials of libtest-mimic, one test per case, so the harness of the test is its own.
[[test]]
name = "official"
harness = false

# The crate is its own workspace, whose lints make lint-rust (cargo clippy) reads: every warning fails, no unsafe code, no
# hidden error (P8), and every allow attribute names its reason; clippy.toml of the root disallows Result::ok and the
# unwrap_or family. config/cargo.schema.json requires unsafe_code and allow_attributes_without_reason.
[lints]
workspace = true

[workspace]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
