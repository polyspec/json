[package]
name = "polyspec-ordered-json"
version = "0.0.25"
edition = "2021"
rust-version = "1.99.0"
description = "Strict JSON with insertion-ordered associative objects and exact number literals"
readme = "README.md"
repository = "https://github.com/polyspec/ordered-json.git"
publish = false
# The package holds the interface contract of the bindings beside the source, so that a library that takes or gives a
# json_value reads the value table from the package that Cargo resolved (bindgen design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json", "/README.md"]

[dependencies]
ryu-js = "=1.0.3"
# The kind interface that the generated bindings read from the core error (bindgen design E-1, I-2 (3)). The git source is the
# bindgen repository; Cargo.lock pins its commit, the same source as the generated binding crates.
polyspec-bindgen-core = { git = "https://github.com/polyspec/bindgen.git", branch = "v1/rust-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "unbounded_depth"] }

[lib]
name = "polyspec_ordered_json"
path = "src/lib.rs"

[dev-dependencies]
base64 = "=0.22.1"
libtest-mimic = "=0.8.2"
sha2 = "0.10"
serde_json = "1"

# The official examples run as the trials of libtest-mimic, one test per case, so the harness of the test is its own.
[[test]]
name = "official"
harness = false

# One trial per case of contracts/core.json, so the harness of the test is libtest-mimic.
[[test]]
name = "contract"
harness = false

# The crate is its own workspace, whose lints make lint-rust (cargo clippy) reads: every warning fails, no unsafe code,
# no unwrap or expect, no discarded result, no cast that can lose or change a value (B-2), and every allow attribute
# names its rule id (R-1); clippy.toml of the root disallows the fallback methods of Option and Result.
# config/cargo.schema.json requires unsafe_code and allow_attributes_without_reason.
[lints]
workspace = true

[workspace]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
