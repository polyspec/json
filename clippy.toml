# The clippy configuration of json. clippy reads clippy.toml from the folder of the Cargo workspace and the
# folders above it. A failure never becomes a plausible value (R-1, P-2, P-3): a Result or an Option is matched, passed
# on with ?, or turned into an error with a kind. A use that is truly needed says so with
# #[allow(clippy::disallowed_methods, reason = "<rule id>")].
disallowed-methods = [
  { path = "core::option::Option::unwrap_or", reason = "P-3: a None becomes a plausible value; match it or give an error with a kind" },
  { path = "core::option::Option::unwrap_or_default", reason = "P-3: a None becomes a default value; match it or give an error with a kind" },
  { path = "core::option::Option::unwrap_or_else", reason = "P-3: a None becomes a computed fallback; match it or give an error with a kind" },
  { path = "core::option::Option::map_or", reason = "P-3: a None becomes a plausible value; match it or give an error with a kind" },
  { path = "core::option::Option::map_or_else", reason = "P-3: a None becomes a computed fallback; match it or give an error with a kind" },
  { path = "core::result::Result::ok", reason = "P-2: an Err becomes None and its error is dropped; match it or use ?" },
  { path = "core::result::Result::map_or", reason = "P-2: an Err becomes a plausible value; match it or use ?" },
  { path = "core::result::Result::map_or_else", reason = "P-2: an Err becomes a computed fallback; match it or use ?" },
  { path = "core::result::Result::unwrap_or", reason = "P-2: an Err becomes a plausible value; match it or use ?" },
  { path = "core::result::Result::unwrap_or_default", reason = "P-2: an Err becomes a default value; match it or use ?" },
  { path = "core::result::Result::unwrap_or_else", reason = "P-2: an Err becomes a computed fallback; match it or use ?" },
]
# R-1 covers the library paths: a #[test] fails by its panic, so unwrap and expect stay allowed there.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
